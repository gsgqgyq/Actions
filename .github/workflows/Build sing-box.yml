name: Build sing-box (gRPC)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '手动强制编译某个版本 (例如 v1.11.0，留空则自动检测)'
        required: false
        default: ''
  schedule:  
    - cron: '0 0 */15 * *' 

permissions:
  contents: write

concurrency:
  group: sing-box-grpc-auto-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ================= STAGE 1: 检查版本 =================
  check-version:
    name: Check Upstream Release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Compare version status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          
          if [ -n "$INPUT_VERSION" ]; then
            if ! gh api "repos/SagerNet/sing-box/git/ref/tags/${INPUT_VERSION}" --silent; then
              echo "❌ 指定的版本 $INPUT_VERSION 在上游仓库中不存在"
              exit 1
            fi
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "▶ 手动指定版本 $INPUT_VERSION，开始编译。"
            exit 0
          fi
          
          UPSTREAM_VERSION=$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)
          
          if [ -z "$UPSTREAM_VERSION" ] || [ "$UPSTREAM_VERSION" = "null" ]; then
            echo "❌ 获取上游版本失败，请检查网络或 API 限制"
            exit 1
          fi
          
          echo "version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
          
          # 🔍 检查这个具体版本号的历史 Release 是否存在
          if gh release view "sing-box-${UPSTREAM_VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "✨ 当前最新正式版 $UPSTREAM_VERSION 已编译过，无需重复编译。"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "🚀 检测到官方发布了新正式版 $UPSTREAM_VERSION，触发自动编译！"
          fi

  # ================= STAGE 2: 混合矩阵编译 =================
  build:
    name: Build (${{ matrix.name }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, name: linux-amd64,   os: ubuntu-latest, cgo: 0, tags_ext: ",with_purego" }
          - { goos: linux,   goarch: arm64, name: linux-arm64,   os: ubuntu-latest, cgo: 0, tags_ext: ",with_purego" }
          - { goos: windows, goarch: amd64, name: windows-amd64, os: ubuntu-latest, cgo: 0, tags_ext: ",with_purego" }
          - { goos: windows, goarch: arm64, name: windows-arm64, os: ubuntu-latest, cgo: 0, tags_ext: ",with_purego" }
          
          - { goos: darwin,  goarch: amd64, name: darwin-amd64,  os: macos-26-intel,  cgo: 1, tags_ext: "" }
          - { goos: darwin,  goarch: arm64, name: darwin-arm64,  os: macos-latest,  cgo: 1, tags_ext: "" }
    steps:
      - name: Checkout sing-box code
        uses: actions/checkout@main
        with:
          repository: 'SagerNet/sing-box'
          ref: ${{ needs.check-version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@main
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Build sing-box
        env:
          BASE_TAGS: with_quic,with_grpc,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_gvisor,with_tailscale,with_ccm,with_naive_outbound,with_cloudflared
        run: |
          mkdir -p release-tmp
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          export CGO_ENABLED=${{ matrix.cgo }}
          
          TAGS="${BASE_TAGS}${{ matrix.tags_ext }}"
          
          VERSION="${{ needs.check-version.outputs.version }}"
          LDFLAGS="-s -w -checklinkname=0 -X 'github.com/sagernet/sing-box/constant.Version=$VERSION'"
          
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi
          
          go build -v -tags "$TAGS" -ldflags "$LDFLAGS" -o ./release-tmp/sing-box_${VERSION}_${{ matrix.name }}$EXT ./cmd/sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: sing-box-${{ matrix.name }}
          path: ./release-tmp/*

  # ================= STAGE 3: 双重发布与双向清理 =================
  publish:
    name: Publish Releases
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Download all artifacts
        uses: actions/download-artifact@main
        with:
          path: ./all-releases
          pattern: sing-box-*
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd ./all-releases
          sha256sum sing-box_* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Deploy to Both Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_STR="${{ needs.check-version.outputs.version }}"
          CURRENT_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          # ---------------- 公用 Release 说明模板 ----------------
          cat <<EOF > release_note.md
          🤖 自动构建的上游版本：\`${VERSION_STR}\`
          🕒 编译发布时间：${CURRENT_TIME}
          
          **支持平台**：
          - Linux (amd64 / arm64)
          - Windows (amd64 / arm64)
          - macOS (Intel amd64 / Apple Silicon arm64)
          
          *包含 gRPC 及全量常用特性。Linux/Windows 为 purego 构建，macOS 为满血 CGO 构建。*
          EOF
          
          # ---------------- 1. 发布到具体版本 (历史保留) ----------------
          TAG_VERSION="sing-box-${VERSION_STR}"
          if gh release view "$TAG_VERSION" >/dev/null 2>&1; then
            echo "🔄 $TAG_VERSION 已存在，覆盖资产..."
            gh release upload "$TAG_VERSION" ./all-releases/* --clobber
          else
            echo "🚀 创建新历史版本 Release: $TAG_VERSION"
            gh release create "$TAG_VERSION" ./all-releases/* --title "$TAG_VERSION" --notes-file release_note.md
          fi
          
          # ---------------- 2. 发布到最新滚动版 (永远最新) ----------------
          TAG_LATEST="singbox-latest"
          if gh release view "$TAG_LATEST" >/dev/null 2>&1; then
            echo "🔄 更新 singbox-latest 滚动版..."
            gh release edit "$TAG_LATEST" --title "Sing-box Pre-built Latest (${VERSION_STR})" --notes-file release_note.md
            gh release upload "$TAG_LATEST" ./all-releases/* --clobber
          else
            echo "🚀 首次创建 singbox-latest 滚动版..."
            gh release create "$TAG_LATEST" ./all-releases/* --title "Sing-box Pre-built Latest (${VERSION_STR})" --notes-file release_note.md
          fi

      # ---------------- 3. 清理历史：保持带版本号的 Release 只有最新 5 个 ----------------
      - name: Keep only latest 5 historical releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 🚨 关键：这里通过 startswith("sing-box-") 精确匹配，会把 "singbox-latest" 完美过滤掉
          releases=$(gh api -X GET "repos/${{ github.repository }}/releases" --paginate --jq '[.[] | select(.tag_name | startswith("sing-box-")) | {id: .id, tag: .tag_name, created: .created_at}]')
          
          if [ -z "$releases" ] || [ "$releases" = "[]" ]; then
            echo "No historical sing-box releases found."
            exit 0
          fi
          
          echo "$releases" | jq -c 'sort_by(.created) | reverse | .[5:][]' | while read -r release; do
            id=$(echo "$release" | jq -r '.id')
            tag=$(echo "$release" | jq -r '.tag')
            
            echo "🧹 正在清理旧历史版本 -> Release ID: $id, Git Tag: $tag"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
          done
          echo "✨ 历史版本清理完成，保留最新 5 个（singbox-latest 保持不动）。"
